name: Publish episodes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check sheet URL is configured
        id: check
        env:
          EPISODE_SHEET_CSV_URL: ${{ secrets.EPISODE_SHEET_CSV_URL }}
        run: |
          if [ -n "$EPISODE_SHEET_CSV_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.check.outputs.configured == 'true'
      # Transcripts are authored by hand in the same sheet and written by this
      # step, so there is no separate transcription job.
      - name: Import new rows and transcripts from Google Sheet
        if: steps.check.outputs.configured == 'true'
        env:
          EPISODE_SHEET_CSV_URL: ${{ secrets.EPISODE_SHEET_CSV_URL }}
        run: npx tsx scripts/publish/from-sheet.ts
      - name: Commit published content
        if: steps.check.outputs.configured == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/episodes src/content/transcripts public/images/episodes
          git diff --cached --quiet || git commit -m "content: publish episodes from sheet"
          git pull --rebase
          git push
