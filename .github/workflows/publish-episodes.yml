name: Publish episodes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  publish:
    if: ${{ secrets.EPISODE_SHEET_CSV_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Transcripts are authored by hand in the same sheet and written by this
      # step, so there is no separate transcription job.
      - name: Import new rows and transcripts from Google Sheet
        env:
          EPISODE_SHEET_CSV_URL: ${{ secrets.EPISODE_SHEET_CSV_URL }}
        run: npx tsx scripts/publish/from-sheet.ts
      - name: Commit published content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/episodes src/content/transcripts public/images/episodes
          git diff --cached --quiet || git commit -m "content: publish episodes from sheet"
          git pull --rebase
          git push
